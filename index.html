          { type: "text", body: "At this point you can build any layout you can describe. This lesson is about deciding what to build: the difference between a page that works and a page that looks like someone meant it." },
          { type: "heading", body: "Visual hierarchy" },
          { type: "text", body: "Hierarchy is the order your eye travels. On a well-designed page you know instantly what to read first, second, and third, without being told. You create it with size, weight, colour, and space, in roughly that order of power." },
          { type: "reference", items: [
            { code: "Size", what: "Bigger reads as more important. The strongest and bluntest tool you have." },
            { code: "Weight", what: "Bolder pulls the eye. Useful when you want emphasis without taking up more room." },
            { code: "Colour", what: "A single accent colour draws attention hard. That is why it stops working the moment you use it five times." },
            { code: "Space", what: "Isolation creates importance. Something with room around it reads as significant." },
          ]},
          { type: "tip", body: "If everything is emphasised, nothing is. Three levels of hierarchy is usually plenty: a headline, a supporting line, and body text." },
          { type: "heading", body: "Whitespace" },
          { type: "text", body: "Whitespace (the empty area between things) isn't wasted space. It's what makes the non-empty parts legible. Beginner pages are almost always too cramped, because empty space feels like something's missing. It isn't." },
          { type: "text", body: "A useful habit: group related things close together and push unrelated things apart. Proximity implies relationship. A heading sitting right above its paragraph clearly belongs to it; the same heading floating equidistant between two paragraphs belongs to neither." },
          { type: "heading", body: "Alignment" },
          { type: "text", body: "Every element should line up with something else. Invisible vertical lines running down a page are what make it feel organised, even to people who could never explain why. Pick a small number of alignment points and stick to them." },

          { type: "reference", items: [

const STORE = {
  read(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  },
  write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {
      // Storage blocked or full. The session still works,
      // it just will not survive a refresh.
    }
  },
};

// Highlights HTML tags and CSS declarations inside step text so the code
// stands out from the instruction. Important when reading in a second language.
function StepText({ text }) {
  const PROPS =
    "font-family|line-height|max-width|margin|padding|border|box-sizing|font-size|" +
    "font-weight|display|flex-direction|justify-content|align-items|gap|flex-wrap|flex|" +
    "grid-template-columns|grid-template-areas|grid-area|color|outline|background";
  const src = `(<[^>]+>|(?:${PROPS}):\\s*[^;]+;|alt="")`;
  const pattern = new RegExp(src, "g");
  const isCode = (p) => new RegExp(`^${src}$`).test(p);
  const pieces = text.split(pattern);
  return (
    <>
      {pieces.map((p, i) =>
        isCode(p) ? (
          <code
            key={i}
            className="mx-0.5 rounded-md border border-cyan-300/20 bg-cyan-400/10 px-1.5 py-0.5 font-mono2 text-[12px] font-medium text-cyan-200"
          >
            {p}
          </code>
        ) : (
          <span key={i}>{p}</span>
        )
      )}
    </>
  );
}

  const [screen, setScreen] = useState("map");
  const [xp, setXp] = useState(() => STORE.read("cs:xp", 0));
  const [furthest, setFurthest] = useState(() => STORE.read("cs:furthest", 0));
  const [openLesson, setOpenLesson] = useState(null);
  const [activePart, setActivePart] = useState(0); // 0 = learn, 1 = practice, 2 = build
  const [done, setDone] = useState(() => STORE.read("cs:done", {}));
  const [checked, setChecked] = useState(() => STORE.read("cs:checked", {}));
  const [showRef, setShowRef] = useState(false);
  const [showAnswer, setShowAnswer] = useState(false);
  const [gaining, setGaining] = useState(null);
  const [gainId, setGainId] = useState(0);
  const [view, setView] = useState("code"); // lab on phones: code | preview
  const [showWelcome, setShowWelcome] = useState(() => !STORE.read("cs:seenWelcome", false));
  const [showLabHint, setShowLabHint] = useState(() => !STORE.read("cs:seenLabHint", false));

  const [files, setFiles] = useState(null);
  const [tab, setTab] = useState("html");
  const [srcDoc, setSrcDoc] = useState("");
  const [ran, setRan] = useState(false);


  const lesson = openLesson !== null ? UNIT_1.lessons[openLesson] : null;
  const part = lesson ? [lesson.learn, lesson.practice, lesson.build][activePart] : null;
  const partMeta = PARTS[activePart];
  const isPractice = activePart === 1;
  const isBuild = activePart === 2;
  const theme = themeFor(openLesson ?? Math.min(furthest, UNIT_1.lessons.length - 1));

  const key = (l, p) => `${l}:${p}`;
  const totalParts = UNIT_1.lessons.length * 3;
  const partsDone = Object.keys(done).filter((k) => done[k]).length;
  const lessonsDone = UNIT_1.lessons.filter(
    (_, i) => done[key(i, 0)] && done[key(i, 1)] && done[key(i, 2)]
  ).length;
  const xpPct = Math.round(Math.min(100, (xp / UNIT_1.totalXp) * 100));

  function buildDoc(f) {
    return `<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>${f.css}</style></head>
<body>${f.html}<script>${f.js}<\/script></body></html>`;
  }

  function run() {
    if (!files) return;
    setSrcDoc(buildDoc(files));
    setRan(true);
    setTimeout(() => setRan(false), 1200);
  }

  // Load this part's files: the student's saved version if they
  // have one, otherwise the starter code.
  useEffect(() => {
    if (screen !== "lesson" || !part?.files) return;
    const saved = STORE.read(codeKey(openLesson, activePart), null);
    const next = saved ?? part.files;
    setFiles(next);
    setTab("html");
    setSrcDoc(buildDoc(next));
  }, [screen, openLesson, activePart]);

  // Save after typing stops, not on every keystroke.
  useEffect(() => {
    if (screen !== "lesson" || !files || !part?.files) return;
    const t = setTimeout(() => {
      STORE.write(codeKey(openLesson, activePart), files);
    }, 1000);
    return () => clearTimeout(t);
  }, [files, screen, openLesson, activePart]);

  useEffect(() => {
    setShowAnswer(false);
    setView("code");
    window.scrollTo(0, 0);
  }, [screen, openLesson, activePart]);

  useEffect(() => STORE.write("cs:xp", xp), [xp]);
  useEffect(() => STORE.write("cs:done", done), [done]);
  useEffect(() => STORE.write("cs:checked", checked), [checked]);
  useEffect(() => STORE.write("cs:furthest", furthest), [furthest]);

  const WELCOME_STEPS = [
    { icon: BookOpen, color: "#22d3ee", deep: "#0e7490", title: "1 · Learn", text: "Read the short lesson. Simple words, small steps." },
    { icon: Dumbbell, color: "#a78bfa", deep: "#6d28d9", title: "2 · Practice", text: "Tap the drills to train what you just read." },
    { icon: Rocket, color: "#e879f9", deep: "#a21caf", title: "3 · Build", text: "Make a real project from scratch." },
  ];

  function dismissWelcome() {
    STORE.write("cs:seenWelcome", true);
    setShowWelcome(false);
  }

  function dismissLabHint() {
    STORE.write("cs:seenLabHint", true);
    setShowLabHint(false);
  }

  function openLessonAt(i, p = 0) {
    setOpenLesson(i);
    setActivePart(p);
    setScreen("lesson");
  }

  function markComplete() {
    const k = key(openLesson, activePart);
    if (done[k]) return;
    const gained = (part.xp ?? 0) + (part.extra?.xp ?? 0);
    const next = { ...done, [k]: true };
    setDone(next);
    setXp((x) => x + gained);
    setGaining(gained);
    setGainId((i) => i + 1);
    setTimeout(() => setGaining(null), 1100);

    if (activePart < 2) {
      setTimeout(() => setActivePart(activePart + 1), 750);
    } else if (next[key(openLesson, 0)] && next[key(openLesson, 1)]) {
      if (openLesson === UNIT_1.lessons.length - 1) {
        setTimeout(() => setScreen("levelup"), 950);
      } else {
        setFurthest((f) => Math.max(f, openLesson + 1));
        setTimeout(() => setScreen("map"), 950);
      }
    }
  }

  function handleTabKey(e) {
    if (e.key !== "Tab") return;
    e.preventDefault();
    const el = e.target;
    const s = el.selectionStart;
    const updated = el.value.slice(0, s) + "  " + el.value.slice(el.selectionEnd);
    setFiles((f) => ({ ...f, [tab]: updated }));
    requestAnimationFrame(() => {
      el.selectionStart = el.selectionEnd = s + 2;
    });
  }

  const renderStatusBar = (accent) => (
    <div
      className="sticky top-0 z-30 border-b border-white/10"
      style={{ background: "rgba(6,10,21,.88)", backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)" }}
    >
      <div className="mx-auto flex max-w-3xl items-center gap-2.5 px-4 py-3 sm:gap-3 sm:px-5">
        <div className="flex items-center gap-2.5">
          <div
            className="flex h-10 w-10 items-center justify-center rounded-2xl text-white"
            style={{ background: `linear-gradient(135deg, ${accent.a}, ${accent.b})`, boxShadow: `0 6px 18px -6px ${accent.ring}` }}
          >
            <Flame className="h-5 w-5" />
          </div>
          <div className="leading-tight">
            <p className="text-sm font-extrabold">Level 1</p>
            <p className="hidden text-[11px] text-slate-500 sm:block">{UNIT_1.badge}</p>
          </div>
        </div>
        <div className="flex min-w-0 flex-1 items-center gap-2">
          <div className="progress-sheen h-2.5 min-w-0 flex-1 overflow-hidden rounded-full bg-white/10">
            <div
              className="h-full rounded-full transition-all duration-700"
              style={{ width: `${xpPct}%`, background: `linear-gradient(90deg, ${accent.b}, ${accent.a})` }}
            />
          </div>
          <span className="shrink-0 font-mono2 text-[11px] font-bold text-slate-400">{xpPct}%</span>
        </div>
        <div className="relative flex shrink-0 items-center gap-1.5 rounded-2xl border border-fuchsia-300/25 bg-fuchsia-400/10 px-3 py-1.5">
          <Zap className="h-3.5 w-3.5 text-fuchsia-300" />
          <span className="text-sm font-extrabold text-fuchsia-200">{xp}</span>
          {gaining !== null && (
            <span key={gainId} className="xp-float">+{gaining}</span>
          )}
        </div>
      </div>
    </div>
  );

  const renderLab = (t) =>
    files && (
      <>
        {showLabHint && activePart !== 0 && (
          <div className="pop-in mb-3 flex items-start gap-3 rounded-2xl border border-cyan-300/25 bg-cyan-400/[.07] p-3.5">
            <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-cyan-400/15">
              <Play className="h-4 w-4 text-cyan-300" />
            </div>
            <p className="flex-1 text-xs leading-relaxed text-slate-300">
              Type your code in the boxes. Then press <span className="font-extrabold text-cyan-200">Run code</span> to see your page in the preview below.
            </p>
            <button
              onClick={dismissLabHint}
              aria-label="Dismiss hint"
              className="pressable flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-white/10 text-slate-400 hover:text-slate-200"
            >
              <X className="h-3.5 w-3.5" />
            </button>
          </div>
        )}
        <div className="mb-6 overflow-hidden rounded-3xl border border-white/10 bg-[#0a101f] shadow-2xl">
        <div className="flex items-center gap-3 border-b border-white/10 px-4 py-3">
          <div className="flex shrink-0 gap-1.5">
            <span className="h-2.5 w-2.5 rounded-full bg-rose-400/80" />
            <span className="h-2.5 w-2.5 rounded-full bg-amber-300/80" />
            <span className="h-2.5 w-2.5 rounded-full bg-emerald-400/80" />
          </div>
          <div className="flex min-w-0 items-center gap-2">
            <Code2 className="h-4 w-4 shrink-0" style={{ color: t.a }} />
            <p className="truncate text-sm font-extrabold">{isBuild ? "Your project" : isPractice ? "Practice sandbox" : "Try it"}</p>
            <span className="hidden shrink-0 text-[10px] text-slate-600 lg:inline">auto-saved</span>
          </div>
          <div className="ml-auto flex shrink-0 items-center gap-2">
            <button
              onClick={() => {
                setFiles(part.files);
                STORE.write(codeKey(openLesson, activePart), part.files);
              }}
              className="pressable flex items-center gap-1.5 rounded-xl border border-white/10 px-2.5 py-2 text-xs font-bold text-slate-400 hover:border-white/25 hover:text-slate-200"
            >
              <RotateCcw className="h-3 w-3" />
              <span className="hidden sm:inline">Reset</span>
            </button>
            <button
              onClick={run}
              className="pressable flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-extrabold text-white"
              style={{ background: `linear-gradient(135deg, ${t.a}, ${t.b})`, boxShadow: `0 6px 18px -6px ${t.ring}` }}
            >
              {ran ? <Check className="h-3.5 w-3.5" /> : <Play className="h-3.5 w-3.5" />}
              {ran ? "Ran it" : "Run code"}
            </button>
          </div>
        </div>

        <div className="flex gap-1 overflow-x-auto border-b border-white/10 px-3 py-2">
          {TABS.map((tb) => (
            <button
              key={tb.key}
              onClick={() => setTab(tb.key)}
              className={`shrink-0 rounded-lg px-3 py-1.5 font-mono2 text-xs font-bold transition-colors ${
                tab === tb.key ? "bg-white/10 text-white" : "text-slate-500 hover:text-slate-300"
              }`}
              style={tab === tb.key ? { boxShadow: `inset 0 -2px 0 ${t.a}` } : undefined}
            >
              {tb.name}
            </button>
          ))}
        </div>

        {/* phones: flip between code and preview instead of a tall stack */}
        <div className="border-b border-white/10 p-2 sm:hidden">
          <div className="grid grid-cols-2 gap-1 rounded-xl bg-white/5 p-1">
            {[
              { v: "code", label: "Code", icon: Code2 },
              { v: "preview", label: "Preview", icon: Eye },
            ].map((o) => (
              <button
                key={o.v}
                onClick={() => setView(o.v)}
                className={`flex items-center justify-center gap-1.5 rounded-lg py-2 text-xs font-extrabold ${
                  view === o.v ? "text-white" : "text-slate-500"
                }`}
                style={view === o.v ? { background: `linear-gradient(135deg, ${t.a}, ${t.b})` } : undefined}
              >
                <o.icon className="h-3.5 w-3.5" /> {o.label}
              </button>
            ))}
          </div>
        </div>

        <textarea
          value={files[tab]}
          spellCheck={false}
          autoCapitalize="off"
          autoCorrect="off"
          onChange={(e) => setFiles((f) => ({ ...f, [tab]: e.target.value }))}
          onKeyDown={handleTabKey}
          className={`code-area font-mono2 w-full resize-none bg-[#070c18] p-4 text-[13px] leading-relaxed text-slate-100 outline-none ${
            view === "preview" ? "hidden" : "block"
          } sm:block ${isBuild ? "h-80" : "h-64"}`}
        />

        <div className={`${view === "code" ? "hidden" : "block"} sm:block border-t border-white/10`}>
          <div className="flex items-center gap-2 px-4 py-2.5">
            <Eye className="h-3.5 w-3.5 text-slate-500" />
            <span className="font-mono2 text-[11px] font-bold uppercase tracking-[.14em] text-slate-500">preview</span>
            <span className="ml-auto text-[10px] text-slate-600">press Run code to update</span>
          </div>
          <iframe
            title="preview"
            srcDoc={srcDoc}
            sandbox="allow-scripts"
            className={`w-full border-0 bg-white ${isBuild ? "h-72 sm:h-80" : "h-64 sm:h-72"}`}
          />
        </div>
      </div>
      </>
    );

  const renderStickyCta = (t) => {
    const isDone = done[key(openLesson, activePart)];
    const cta = isBuild
      ? { label: "Submit project", doneLabel: "Project submitted" }
      : isPractice
      ? { label: "Mark drills complete", doneLabel: "Drills complete" }
      : { label: "Mark complete", doneLabel: "Completed" };
    const xpGain = (part.xp ?? 0) + (part.extra?.xp ?? 0);
    return (
      <div className="sticky bottom-0 z-30 mt-8 border-t border-white/10" style={{ background: "rgba(6,10,21,.93)", backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)" }}>
        <div className="mx-auto flex max-w-3xl items-center gap-3 px-4 py-3 sm:px-5" style={{ paddingBottom: "max(0.75rem, env(safe-area-inset-bottom))" }}>
          <div className="min-w-0 flex-1">
            <p className="text-[10px] font-extrabold uppercase tracking-[.16em]" style={{ color: partMeta.color }}>
              {partMeta.label} · part {activePart + 1} of 3
            </p>
            <p className="truncate text-sm font-extrabold text-slate-100">
              {isDone ? cta.doneLabel : `${cta.label} · +${xpGain} XP`}
            </p>
          </div>
          <button
            onClick={markComplete}
            disabled={isDone}
            className="pressable flex shrink-0 items-center gap-2 rounded-2xl px-5 py-3.5 text-sm font-extrabold text-white sm:px-6"
            style={
              isDone
                ? { background: "rgba(52,211,153,.12)", border: "1px solid rgba(52,211,153,.4)", color: "#6ee7b7" }
                : { background: `linear-gradient(135deg, ${partMeta.color}, ${partMeta.deep})`, boxShadow: `0 12px 30px -8px ${partMeta.color}77` }
            }
          >
            {isDone ? (
              <>
                <CheckCircle2 className="h-4 w-4" /> Done
              </>
            ) : (
              <>
                {cta.label} <ArrowRight className="h-4 w-4" />
              </>
            )}
          </button>
        </div>
      </div>
    );
  };

  // ─────────────────────────── MAP ───────────────────────────
  if (screen === "map") {
    const mapAccent = themeFor(Math.min(furthest, UNIT_1.lessons.length - 1));
    const stats = [
      { icon: Zap, label: "Total XP", value: xp, color: "#e879f9", soft: "rgba(232,121,249,.14)" },
      { icon: CheckCircle2, label: "Parts done", value: `${partsDone}/${totalParts}`, color: "#34d399", soft: "rgba(52,211,153,.14)" },
      { icon: Trophy, label: "Lessons done", value: `${lessonsDone}/${UNIT_1.lessons.length}`, color: "#fbbf24", soft: "rgba(251,191,36,.14)" },
    ];
    return (
      <div className="min-h-screen">
        {renderStatusBar(mapAccent)}
        <div className="mx-auto max-w-3xl px-4 pb-12 pt-5 sm:px-5 sm:pt-7">
          {/* hero */}
          <div className="screen-enter relative mb-6 overflow-hidden rounded-3xl border border-white/10 p-6 sm:p-8" style={{ background: "linear-gradient(135deg, rgba(34,211,238,.09), rgba(232,121,249,.07) 55%, rgba(255,255,255,.02))" }}>
            <div className="absolute -right-14 -top-14 h-52 w-52 rounded-full blur-3xl" style={{ background: "rgba(34,211,238,.16)" }} />
            <div className="absolute -bottom-16 -left-10 h-52 w-52 rounded-full blur-3xl" style={{ background: "rgba(232,121,249,.13)" }} />
            <div className="relative">
              <p className="mb-3 inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1 text-[11px] font-extrabold tracking-wide text-slate-300">
                <span className="pulse-dot h-1.5 w-1.5 rounded-full bg-emerald-400" />
                UNIT 1 · HTML &amp; CSS · LIVE NOW
              </p>
              <h1 className="font-display text-3xl font-extrabold sm:text-4xl">
                Your course{" "}
                <span className="bg-gradient-to-r from-cyan-300 via-violet-300 to-fuchsia-300 bg-clip-text text-transparent">map</span>
              </h1>
              <p className="mt-2 max-w-md text-sm leading-relaxed text-slate-400">
                Eight lessons, each ending with something real you built. Tap a lesson to jump straight in.
              </p>
              <div className="mt-5 grid grid-cols-3 gap-2.5 sm:gap-3">
                {stats.map((s, i) => (
                  <div key={i} className="rounded-2xl border border-white/10 bg-white/[.04] p-3 sm:p-4">
                    <div className="mb-2 flex h-7 w-7 items-center justify-center rounded-lg" style={{ background: s.soft }}>
                      <s.icon className="h-3.5 w-3.5" style={{ color: s.color }} />
                    </div>
                    <p className="text-lg font-extrabold leading-none sm:text-xl">{s.value}</p>
                    <p className="mt-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-500">{s.label}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* units */}
          <div className="mb-8 grid grid-cols-2 gap-2.5 sm:gap-3">
            <div
              className="relative overflow-hidden rounded-2xl border p-4"
              style={{ borderColor: "rgba(34,211,238,.4)", background: "linear-gradient(135deg, rgba(34,211,238,.12), rgba(34,211,238,.03))" }}
            >
              <div className="mb-2.5 flex h-9 w-9 items-center justify-center rounded-xl text-white" style={{ background: "linear-gradient(135deg,#22d3ee,#0e7490)" }}>
                <Code2 className="h-4 w-4" />
              </div>
              <p className="text-sm font-extrabold text-slate-100">{UNIT_1.title}</p>
              <p className="text-xs text-slate-400">{UNIT_1.sub}</p>
              <span className="mt-2 inline-flex items-center gap-1.5 rounded-full bg-cyan-400/15 px-2 py-0.5 text-[10px] font-extrabold text-cyan-300">
                <span className="pulse-dot h-1.5 w-1.5 rounded-full bg-cyan-300" /> LIVE
              </span>
            </div>
            {LOCKED_UNITS.map((u, i) => {
              const lt = themeFor(i + 1);
              const Icon = u.icon || Lock;
              return (
                <div key={i} className="rounded-2xl border border-white/[.07] bg-white/[.02] p-4" style={{ background: `linear-gradient(135deg, ${lt.soft}, transparent 70%)` }}>
                  <div className="mb-2.5 flex h-9 w-9 items-center justify-center rounded-xl bg-white/5">
                    <Lock className="h-3.5 w-3.5 text-slate-500" />
                  </div>
                  <p className="text-sm font-extrabold text-slate-400">{u.title}</p>
                  <p className="text-xs text-slate-600">{u.sub}</p>
                  <span className="mt-2 inline-block rounded-full bg-white/5 px-2 py-0.5 text-[10px] font-extrabold text-slate-600">LOCKED</span>
                </div>
              );
            })}
          </div>

          {/* lessons */}
          <div className="mb-3 flex items-center justify-between">
            <h2 className="font-display text-base font-extrabold">Lessons</h2>
            <div className="flex items-center gap-3">
              <span className="text-xs font-bold text-slate-500">{lessonsDone}/{UNIT_1.lessons.length} complete</span>
              {xp > 0 && (
                <button
                  onClick={() => {
                    if (!confirm("Clear all progress and saved code on this device?")) return;
                    Object.keys(localStorage)
                      .filter((k) => k.startsWith("cs:"))
                      .forEach((k) => localStorage.removeItem(k));
                    setXp(0);
                    setDone({});
                    setChecked({});
                    setFurthest(0);
                  }}
                  className="rounded-lg border border-white/10 px-2.5 py-1.5 text-[11px] font-bold text-slate-500 hover:border-white/25 hover:text-slate-300"
                >
                  Reset all
                </button>
              )}
            </div>
          </div>

          <div className="space-y-2.5">
            {UNIT_1.lessons.map((l, i) => {
              const t = themeFor(i);
              const nParts = [0, 1, 2].filter((p) => done[key(i, p)]).length;
              const complete = nParts === 3;
              const locked = i > furthest;
              const isNext = i === furthest && !complete;
              return (
                <div
                  key={i}
                  className={`pressable relative overflow-hidden rounded-2xl border ${
                    locked ? "border-white/[.06] bg-white/[.02]" : "border-white/10 bg-white/[.04] hover:bg-white/[.06]"
                  }`}
                  style={!locked && isNext ? { borderColor: t.ring, boxShadow: `0 10px 34px -14px ${t.ring}` } : undefined}
                >
                  {isNext && !locked && (
                    <div className="absolute inset-x-0 top-0 h-[3px]" style={{ background: `linear-gradient(90deg, transparent, ${t.a}, transparent)` }} />
                  )}
                  <button
                    onClick={() => !locked && openLessonAt(i)}
                    disabled={locked}
                    className="flex w-full items-center gap-3.5 p-3.5 text-left sm:gap-4 sm:p-4 disabled:cursor-not-allowed"
                  >
                    <div
                      className="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl text-base font-extrabold text-white"
                      style={
                        complete
                          ? { background: "linear-gradient(135deg,#34d399,#047857)", boxShadow: "0 6px 18px -6px rgba(52,211,153,.5)" }
                          : locked
                          ? { background: "rgba(255,255,255,.05)", color: "#475569" }
                          : { background: `linear-gradient(135deg, ${t.a}, ${t.b})`, boxShadow: `0 6px 18px -6px ${t.ring}` }
                      }
                    >
                      {complete ? <Check className="h-5 w-5" /> : locked ? <Lock className="h-4 w-4" /> : i + 1}
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center gap-2">
                        <p className={`truncate text-sm font-extrabold sm:text-[15px] ${locked ? "text-slate-600" : "text-slate-100"}`}>
                          {l.title}
                        </p>
                        {isNext && (
                          <span className="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wide" style={{ background: t.soft, color: t.a }}>
                            Up next
                          </span>
                        )}
                      </div>
                      {!locked && <p className="clamp-2 mt-0.5 text-xs leading-relaxed text-slate-400">{l.blurb}</p>}
                      {locked && <p className="mt-0.5 text-xs text-slate-600">Finish lesson {i} to unlock</p>}
                      <div className="mt-2 flex items-center gap-2.5">
                        <span className="inline-flex items-center gap-1 rounded-full bg-white/5 px-2 py-0.5 text-[10px] font-extrabold" style={{ color: locked ? "#475569" : t.a }}>
                          <Zap className="h-2.5 w-2.5" /> {l.xp} XP
                        </span>
                        {!locked && !complete && (
                          <span className="flex items-center gap-1">
                            {[0, 1, 2].map((p) => (
                              <span key={p} className="h-1.5 w-5 rounded-full" style={{ background: done[key(i, p)] ? t.a : "rgba(255,255,255,.12)" }} />
                            ))}
                          </span>
                        )}
                        {complete && (
                          <span className="inline-flex items-center gap-1 rounded-full bg-emerald-400/10 px-2 py-0.5 text-[10px] font-extrabold text-emerald-300">
                            <Check className="h-2.5 w-2.5" /> Done
                          </span>
                        )}
                      </div>
                    </div>
                    {!locked && (
                      <div
                        className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-white/10 bg-white/5"
                        style={complete ? undefined : { borderColor: t.ring }}
                      >
                        {complete
                          ? <CheckCircle2 className="h-4.5 w-4.5 text-emerald-400" style={{ width: 18, height: 18 }} />
                          : <Play className="h-4 w-4" style={{ color: t.a }} />}
                      </div>
                    )}
                  </button>
                </div>
              );
            })}
          </div>

          <div className="mt-8 flex items-center justify-center gap-2">
            <Info className="h-3.5 w-3.5 shrink-0 text-slate-600" />
            <p className="text-[11px] text-slate-600">Your XP and code are saved on this device.</p>
          </div>
        </div>
        {showWelcome && (
          <div
            className="fixed inset-0 z-50 flex items-center justify-center p-4"
            style={{ background: "rgba(3,6,14,.8)", backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }}
          >
            <div className="pop-in relative max-h-[90vh] w-full max-w-md overflow-y-auto rounded-3xl border border-white/10 bg-[#0b1222] p-6 shadow-2xl sm:p-7">
              <div className="absolute -right-12 -top-12 h-40 w-40 rounded-full blur-3xl" style={{ background: "rgba(34,211,238,.16)" }} />
              <div className="absolute -bottom-12 -left-12 h-40 w-40 rounded-full blur-3xl" style={{ background: "rgba(232,121,249,.13)" }} />
              <div className="relative">
                <div
                  className="mb-4 flex h-12 w-12 items-center justify-center rounded-2xl text-white"
                  style={{ background: "linear-gradient(135deg,#22d3ee,#0e7490)", boxShadow: "0 10px 26px -8px rgba(34,211,238,.5)" }}
                >
                  <Sparkles className="h-6 w-6" />
                </div>
                <h2 className="font-display text-2xl font-extrabold">Welcome!</h2>
                <p className="mt-1 text-sm leading-relaxed text-slate-400">Every lesson has 3 parts. Do them in order.</p>
                <div className="mt-5 space-y-2.5">
                  {WELCOME_STEPS.map((s, i) => (
                    <div key={i} className="flex items-center gap-3 rounded-2xl border border-white/10 bg-white/[.03] p-3.5">
                      <div
                        className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-white"
                        style={{ background: `linear-gradient(135deg, ${s.color}, ${s.deep})` }}
                      >
                        <s.icon className="h-5 w-5" />
                      </div>
                      <div className="min-w-0">
                        <p className="text-sm font-extrabold" style={{ color: s.color }}>{s.title}</p>
                        <p className="text-xs leading-relaxed text-slate-400">{s.text}</p>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mt-2.5 flex items-center gap-3 rounded-2xl border border-cyan-300/25 bg-cyan-400/[.07] p-3.5">
                  <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-cyan-400/15">
                    <Play className="h-5 w-5 text-cyan-300" />
                  </div>
                  <p className="text-xs leading-relaxed text-slate-300">
                    In the code lab, press <span className="font-extrabold text-cyan-200">Run code</span> to see your page.
                  </p>
                </div>
                <div className="mt-2.5 flex items-start gap-2.5 rounded-2xl border border-white/10 bg-white/[.03] p-3.5">
                  <Info className="mt-0.5 h-4 w-4 shrink-0 text-slate-400" />
                  <p className="text-xs leading-relaxed text-slate-400">
                    <span className="font-extrabold text-slate-200">Your progress saves on this device.</span> Use the same phone or computer each time.
                  </p>
                </div>
                <button
                  onClick={dismissWelcome}
                  className="pressable mt-5 flex w-full items-center justify-center gap-2 rounded-2xl py-3.5 text-sm font-extrabold text-white"
                  style={{ background: "linear-gradient(135deg,#22d3ee,#0e7490)", boxShadow: "0 12px 30px -8px rgba(34,211,238,.5)" }}
                >
                  Start learning <ArrowRight className="h-4 w-4" />
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ─────────────────────────── LESSON ───────────────────────────
  if (screen === "lesson") {
    const t = themeFor(openLesson);
    const isDone = done[key(openLesson, activePart)];
    return (
      <div className="min-h-screen">
        {renderStatusBar(t)}
        <div className="mx-auto max-w-3xl px-4 pb-10 pt-5 sm:px-5 sm:pt-7">
          <button
            onClick={() => setScreen("map")}
            className="pressable mb-4 inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-white/5 px-3.5 py-2 text-xs font-extrabold text-slate-300 hover:border-white/25"
          >
            <ChevronLeft className="h-3.5 w-3.5" /> Course map
          </button>

          {/* header */}
          <div
            className="screen-enter relative mb-5 overflow-hidden rounded-3xl border border-white/10 p-5 sm:p-6"
            style={{ background: `linear-gradient(135deg, ${t.soft}, rgba(255,255,255,.02) 60%)` }}
          >
            <div className="absolute -right-10 -top-10 h-44 w-44 rounded-full blur-3xl" style={{ background: t.soft }} />
            <div className="relative flex items-start gap-4">
              <div
                className="floaty flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl text-xl font-extrabold text-white"
                style={{ background: `linear-gradient(135deg, ${t.a}, ${t.b})`, boxShadow: `0 10px 26px -8px ${t.ring}` }}
              >
                {openLesson + 1}
              </div>
              <div className="min-w-0 flex-1">
                <p className="text-[11px] font-extrabold uppercase tracking-[.16em]" style={{ color: t.a }}>
                  Lesson {openLesson + 1} · {UNIT_1.sub}
                </p>
                <h1 className="font-display mt-1 text-2xl font-extrabold sm:text-[28px]">{lesson.title}</h1>
                <p className="mt-1.5 text-sm leading-relaxed text-slate-400">{lesson.blurb}</p>
                <div className="mt-3 flex flex-wrap items-center gap-2">
                  <span className="inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-black/30 px-2.5 py-1 text-[11px] font-extrabold" style={{ color: t.a }}>
                    <Zap className="h-3 w-3" /> {lesson.xp} XP up for grabs
                  </span>
                  <span className="inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-black/30 px-2.5 py-1">
                    {[0, 1, 2].map((p) => (
                      <span key={p} title={PARTS[p].label} className="h-1.5 w-6 rounded-full" style={{ background: done[key(openLesson, p)] ? PARTS[p].color : "rgba(255,255,255,.12)" }} />
                    ))}
                  </span>
                </div>
              </div>
            </div>
          </div>

          {/* core reference */}
          <div className="mb-5">
            <button
              onClick={() => setShowRef((v) => !v)}
              className={`pressable flex w-full items-center gap-3 rounded-2xl border p-3.5 text-left ${
                showRef ? "border-emerald-300/30 bg-emerald-300/[.06]" : "border-white/10 bg-white/[.03] hover:border-white/20"
              }`}
            >
              <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-emerald-300/15">
                <BookMarked className="h-4 w-4 text-emerald-300" />
              </div>
              <div className="min-w-0 flex-1">
                <p className="text-sm font-extrabold text-slate-100">Core reference</p>
                <p className="truncate text-xs text-slate-500">Open this when you forget a word</p>
              </div>
              <ChevronDown className={`h-4 w-4 shrink-0 text-slate-400 transition-transform duration-300 ${showRef ? "rotate-180" : ""}`} />
            </button>
            {showRef && (
              <div className="pop-in mt-2 overflow-hidden rounded-2xl border border-white/10">
                {lesson.learn.ref.map((r, i) => (
                  <div
                    key={i}
                    className={`p-4 ${i > 0 ? "border-t border-white/10" : ""}`}
                    style={{ background: i % 2 ? "rgba(255,255,255,.015)" : "rgba(255,255,255,.045)" }}
                  >
                    <p className="font-mono2 text-[13px] font-bold text-emerald-300">{r.label}</p>
                    <p className="mt-1 text-sm leading-relaxed text-slate-300">
                      <StepText text={r.body} />
                    </p>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* part switcher */}
          <div className="grid grid-cols-3 gap-1 rounded-2xl border border-white/10 bg-black/40 p-1.5">
            {PARTS.map((pm, i) => {
              const active = i === activePart;
              const partDone = done[key(openLesson, i)];
              const Icon = pm.icon;
              return (
                <button
                  key={pm.key}
                  onClick={() => setActivePart(i)}
                  className={`pressable flex items-center justify-center gap-1.5 rounded-xl px-2 py-2.5 text-xs font-extrabold sm:text-sm ${
                    active ? "text-white" : "text-slate-400 hover:text-slate-200"
                  }`}
                  style={active ? { background: `linear-gradient(135deg, ${pm.color}, ${pm.deep})`, boxShadow: `0 8px 22px -8px ${pm.color}99` } : undefined}
                >
                  {partDone && !active
                    ? <CheckCircle2 className="h-4 w-4 shrink-0 text-emerald-400" />
                    : <Icon className="h-4 w-4 shrink-0" />}
                  {pm.label}
                </button>
              );
            })}
          </div>
          <p className="mb-6 mt-2 text-center text-xs text-slate-500">{part.subtitle}</p>

          <div key={activePart} className="screen-enter">
            {/* LEARN */}
            {!isPractice && !isBuild && (
              <>
                <div className="mb-6 rounded-3xl border border-white/10 bg-white/[.03] p-5 sm:p-6">
                  <ConceptBlocks blocks={lesson.learn.blocks} theme={t} />
                </div>
                <div className="mb-6 rounded-3xl border border-indigo-300/25 bg-indigo-400/[.05] p-5 sm:p-6">
                  <div className="mb-3 flex items-center gap-2.5">
                    <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-400/15">
                      <HelpCircle className="h-4 w-4 text-indigo-300" />
                    </div>
                    <h2 className="font-display text-base font-extrabold">Check your learning</h2>
                  </div>
                  <p className="mb-3 text-[15px] leading-relaxed text-slate-200">
                    <StepText text={lesson.learn.check.q} />
                  </p>
                  <button
                    onClick={() => setShowAnswer((v) => !v)}
                    className="pressable rounded-xl border border-indigo-300/30 px-3.5 py-2 font-mono2 text-[11px] font-bold text-indigo-200 hover:bg-indigo-400/10"
                  >
                    {showAnswer ? "Hide answer" : "Reveal answer"}
                  </button>
                  {showAnswer && (
                    <p className="pop-in mt-3 border-t border-indigo-300/15 pt-3 text-sm leading-relaxed text-slate-300">
                      <StepText text={lesson.learn.check.a} />
                    </p>
                  )}
                </div>
                <div
                  className="mb-6 rounded-3xl border p-5 sm:p-6"
                  style={{ borderColor: t.ring, background: `linear-gradient(180deg, ${t.soft}, rgba(255,255,255,.015))` }}
                >
                  <div className="mb-3 flex items-center gap-2.5">
                    <div className="flex h-9 w-9 items-center justify-center rounded-xl text-white" style={{ background: `linear-gradient(135deg, ${t.a}, ${t.b})` }}>
                      <ListChecks className="h-4 w-4" />
                    </div>
                    <h2 className="font-display text-base font-extrabold">Your turn</h2>
                  </div>
                  <p className="mb-4 text-[15px] leading-relaxed text-slate-200">{part.task}</p>

                  {part.extra && (
                    <div className="flex items-start gap-3 rounded-2xl border border-white/10 bg-black/30 p-3.5">
                      <span className="shrink-0 rounded-lg px-2 py-1 text-[11px] font-extrabold text-white" style={{ background: `linear-gradient(135deg, ${t.a}, ${t.b})` }}>
                        +{part.extra.xp} XP
                      </span>
                      <div className="min-w-0">
                        <p className="text-xs font-extrabold" style={{ color: t.a }}>{part.extra.label}</p>
                        <p className="mt-0.5 text-xs leading-relaxed text-slate-400">{part.extra.text}</p>
                      </div>
                    </div>
                  )}
                </div>
                {renderLab(t)}
              </>
            )}

            {/* PRACTICE */}
            {isPractice && (
              <>
                <div className="mb-6 rounded-3xl border border-violet-300/25 bg-violet-400/[.05] p-5 sm:p-6">
                  <div className="mb-3 flex items-center gap-2.5">
                    <div className="flex h-9 w-9 items-center justify-center rounded-xl text-white" style={{ background: "linear-gradient(135deg,#a78bfa,#6d28d9)" }}>
                      <Dumbbell className="h-4 w-4" />
                    </div>
                    <h2 className="font-display text-base font-extrabold">Drills</h2>
                    <span className="ml-auto rounded-full bg-violet-400/15 px-2.5 py-1 text-[11px] font-extrabold text-violet-200">
                      {part.drills.filter((_, i) => checked[`${openLesson}:${i}`]).length}/{part.drills.length}
                    </span>
                  </div>
                  <div className="mb-4 h-1.5 overflow-hidden rounded-full bg-white/10">
                    <div
                      className="h-full rounded-full transition-all duration-500"
                      style={{ width: `${(part.drills.filter((_, i) => checked[`${openLesson}:${i}`]).length / part.drills.length) * 100}%`, background: "linear-gradient(90deg,#6d28d9,#a78bfa)" }}
                    />
                  </div>
                  <p className="mb-4 text-[15px] leading-relaxed text-slate-300">{part.intro}</p>
                  <div className="space-y-2">
                    {part.drills.map((d, i) => {
                      const k = `${openLesson}:${i}`;
                      const on = checked[k];
                      return (
                        <button
                          key={i}
                          onClick={() => setChecked((c) => ({ ...c, [k]: !c[k] }))}
                          className={`pressable flex w-full items-start gap-3 rounded-2xl border p-3.5 text-left ${
                            on ? "border-emerald-300/25 bg-emerald-300/[.05]" : "border-white/10 bg-black/30 hover:border-white/20"
                          }`}
                        >
                          <span
                            className="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg text-[11px] font-extrabold text-white"
                            style={on ? { background: "linear-gradient(135deg,#34d399,#047857)" } : { background: "linear-gradient(135deg,#a78bfa,#6d28d9)" }}
                          >
                            {on ? <Check className="h-3.5 w-3.5" /> : i + 1}
                          </span>
                          <div className="min-w-0">
                            <p className={`text-sm leading-relaxed ${on ? "text-slate-500 line-through" : "text-slate-100"}`}>
                              <StepText text={d.text} />
                            </p>
                            {d.hint && !on && (
                              <p className="mt-1.5 flex items-start gap-1.5 text-xs leading-relaxed text-slate-500">
                                <Lightbulb className="mt-0.5 h-3 w-3 shrink-0 text-amber-300/70" />
                                {d.hint}
                              </p>
                            )}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
                {renderLab(t)}
              </>
            )}

            {/* BUILD */}
            {isBuild && (
              <>
                <div className="mb-6 rounded-3xl border border-fuchsia-300/25 bg-fuchsia-400/[.05] p-5 sm:p-6">
                  <div className="mb-3 flex items-center gap-2.5">
                    <div className="flex h-9 w-9 items-center justify-center rounded-xl text-white" style={{ background: "linear-gradient(135deg,#e879f9,#a21caf)" }}>
                      <Rocket className="h-4 w-4" />
                    </div>
                    <h2 className="font-display text-base font-extrabold">Project brief</h2>
                    <span className="ml-auto rounded-full bg-fuchsia-400/15 px-2.5 py-1 text-[11px] font-extrabold text-fuchsia-200">
                      {part.requirements.filter((_, i) => checked[`b${openLesson}:${i}`]).length}/{part.requirements.length}
                    </span>
                  </div>
                  <div className="mb-4 h-1.5 overflow-hidden rounded-full bg-white/10">
                    <div
                      className="h-full rounded-full transition-all duration-500"
                      style={{ width: `${(part.requirements.filter((_, i) => checked[`b${openLesson}:${i}`]).length / part.requirements.length) * 100}%`, background: "linear-gradient(90deg,#a21caf,#e879f9)" }}
                    />
                  </div>
                  <p className="mb-4 text-[15px] leading-relaxed text-slate-300">{part.brief}</p>
                  <p className="mb-2 text-[11px] font-extrabold uppercase tracking-[.14em] text-slate-500">Build steps</p>
                  <div className="space-y-2">
                    {part.requirements.map((r, i) => {
                      const k = `b${openLesson}:${i}`;
                      const on = checked[k];
                      return (
                        <button
                          key={i}
                          onClick={() => setChecked((c) => ({ ...c, [k]: !c[k] }))}
                          className={`pressable flex w-full items-start gap-3 rounded-2xl border p-3 text-left ${
                            on ? "border-emerald-300/25 bg-emerald-300/[.05]" : "border-white/10 bg-black/30 hover:border-white/20"
                          }`}
                        >
                          {on
                            ? <CheckSquare className="mt-0.5 h-4 w-4 shrink-0 text-emerald-400" />
                            : <Square className="mt-0.5 h-4 w-4 shrink-0 text-slate-600" />}
                          <span className={`text-sm leading-relaxed ${on ? "text-slate-500 line-through" : "text-slate-100"}`}>
                            <StepText text={r} />
                          </span>
                        </button>
                      );
                    })}
                  </div>
                  <div className="mt-4 flex items-center gap-2.5 rounded-2xl border border-white/10 bg-black/30 px-3.5 py-3">
                    <Code2 className="h-4 w-4 shrink-0 text-fuchsia-300" />
                    <p className="text-xs leading-relaxed text-slate-400">The files below are empty on purpose. Build this from scratch.</p>
                  </div>
                  {part.deploy && (
                    <div className="mt-2 flex items-center gap-2.5 rounded-2xl border border-white/10 bg-black/30 px-3.5 py-3">
                      <Globe className="h-4 w-4 shrink-0 text-cyan-300" />
                      <p className="text-xs leading-relaxed text-slate-400">When it&apos;s working here, move it to your own editor, commit it, and deploy it live.</p>
                    </div>
                  )}
                </div>
                {renderLab(t)}
              </>
            )}
          </div>
        </div>
        {renderStickyCta(t)}
      </div>
    );
  }

  // ─────────────────────────── LEVEL UP ───────────────────────────
  const confettiColors = THEMES.map((x) => x.a);
  return (
    <div className="relative flex min-h-screen items-center justify-center overflow-hidden p-4">
      <div className="pointer-events-none fixed inset-0" aria-hidden="true">
        {Array.from({ length: 26 }).map((_, i) => {
          const left = (i * 41 + 7) % 100;
          const delay = ((i * 137) % 2200) / 1000;
          const dur = 2.8 + ((i * 53) % 22) / 10;
          const size = 5 + ((i * 29) % 5);
          return (
            <span
              key={i}
              className="confetti-bit"
              style={{
                left: `${left}%`,
                width: size,
                height: Math.max(3, size * 0.55),
                background: confettiColors[i % confettiColors.length],
                animationDelay: `${delay}s`,
                animationDuration: `${dur}s`,
              }}
            />
          );
        })}
      </div>
      <div className="pop-in relative w-full max-w-sm overflow-hidden rounded-3xl border border-white/10 bg-white/[.04] p-8 text-center shadow-2xl" style={{ backdropFilter: "blur(12px)" }}>
        <div className="absolute -right-12 -top-12 h-40 w-40 rounded-full blur-3xl" style={{ background: "rgba(251,191,36,.16)" }} />
        <div className="absolute -bottom-12 -left-12 h-40 w-40 rounded-full blur-3xl" style={{ background: "rgba(232,121,249,.14)" }} />
        <div className="relative">
          <div className="relative mx-auto mb-5 flex h-24 w-24 items-center justify-center">
            <span className="absolute inset-0 rounded-full bg-amber-400/25 blur-xl" />
            <span className="absolute inset-0 animate-ping rounded-full bg-amber-400/10" style={{ animationDuration: "2.2s" }} />
            <div className="relative flex h-20 w-20 items-center justify-center rounded-full text-white" style={{ background: "linear-gradient(135deg,#fbbf24,#b45309)", boxShadow: "0 14px 36px -10px rgba(251,191,36,.55)" }}>
              <Trophy className="h-9 w-9" />
            </div>
          </div>
          <p className="mb-1 text-[11px] font-extrabold uppercase tracking-[.22em] text-emerald-300">Unit complete</p>
          <h1 className="font-display text-3xl font-extrabold">{UNIT_1.badge} unlocked</h1>
          <p className="mt-2 text-sm leading-relaxed text-slate-400">
            You finished {UNIT_1.title} with <span className="font-extrabold text-slate-100">{xp} XP</span>. JavaScript is next.
          </p>
          <div className="mb-6 mt-5 flex items-center gap-3 rounded-2xl border border-fuchsia-300/25 bg-fuchsia-400/[.07] p-3.5 text-left">
            <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-white" style={{ background: "linear-gradient(135deg,#e879f9,#a21caf)" }}>
              <Star className="h-5 w-5" />
            </div>
            <div className="min-w-0">
              <p className="text-[11px] font-bold uppercase tracking-wider text-slate-500">New badge earned</p>
              <p className="truncate text-sm font-extrabold text-slate-100">{UNIT_1.badge}</p>
            </div>
          </div>
          <button
            onClick={() => setScreen("map")}
            className="pressable flex w-full items-center justify-center gap-2 rounded-2xl py-3.5 text-sm font-extrabold text-white"
            style={{ background: "linear-gradient(135deg,#22d3ee,#0e7490)", boxShadow: "0 12px 30px -8px rgba(34,211,238,.5)" }}
          >
            Back to map <ArrowRight className="h-4 w-4" />
          </button>
        </div>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
rootEl.innerHTML = "";
ReactDOM.createRoot(rootEl).render(<Prototype />);
</script>
</body>
</html>
