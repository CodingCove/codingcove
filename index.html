          { type: "text", body: "At this point you can build any layout you can describe. This lesson is about deciding what to build — the difference between a page that works and a page that looks like someone meant it." },
          { type: "heading", body: "Visual hierarchy" },
          { type: "text", body: "Hierarchy is the order your eye travels. On a well-designed page you know instantly what to read first, second, and third — without being told. You create it with size, weight, colour, and space, in roughly that order of power." },
          { type: "reference", items: [
            { code: "Size", what: "Bigger reads as more important. The strongest and bluntest tool you have." },
            { code: "Weight", what: "Bolder pulls the eye. Useful when you want emphasis without taking up more room." },
            { code: "Colour", what: "A single accent colour draws attention hard — which is why it stops working the moment you use it five times." },
            { code: "Space", what: "Isolation creates importance. Something with room around it reads as significant." },
          ]},
          { type: "tip", body: "If everything is emphasised, nothing is. Three levels of hierarchy is usually plenty: a headline, a supporting line, and body text." },
          { type: "heading", body: "Whitespace" },
          { type: "text", body: "Whitespace — the empty area between things — isn't wasted space. It's what makes the non-empty parts legible. Beginner pages are almost always too cramped, because empty space feels like something's missing. It isn't." },
          { type: "text", body: "A useful habit: group related things close together and push unrelated things apart. Proximity implies relationship. A heading sitting right above its paragraph clearly belongs to it; the same heading floating equidistant between two paragraphs belongs to neither." },
          { type: "heading", body: "Alignment" },
          { type: "text", body: "Every element should line up with something else. Invisible vertical lines running down a page are what make it feel organised, even to people who could never explain why. Pick a small number of alignment points and stick to them." },
          { type: "heading", body: "Colour, used sparingly" },
          { type: "reference", items: [
            { code: "One primary", what: "Your main brand or mood colour. Used for the most important element on a screen." },
            { code: "One accent", what: "For calls to action and highlights. Should contrast the primary." },
            { code: "Neutrals", what: "Greys and off-whites for backgrounds, borders, and body text. Most of your page should be neutral." },
            { code: "Semantic colours", what: "Red for errors, green for success. Don't reuse these decoratively — people read meaning into them." },
          ]},

// Persistence
//
// This mirrors the interface in data.js. Right now it writes to
// localStorage; swapping in the Supabase version means changing
// these four functions and nothing else in the component.
// ------------------------------------------------------------

const STORE = {
  read(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  },
  write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {
      // Storage blocked or full — the session still works,
      // it just will not survive a refresh.
    }
  },
};

const codeKey = (l, p) => `cs:code:0:${l}:${p}`;

// Highlights HTML tags and CSS declarations inside step text so the code
// stands out from the instruction — important when reading in a second language.
function StepText({ text }) {
  const PROPS =
    "font-family|line-height|max-width|margin|padding|border|box-sizing|font-size|" +
    "font-weight|display|flex-direction|justify-content|align-items|gap|flex-wrap|flex|" +
    "grid-template-columns|grid-template-areas|grid-area|color|outline|background";
  const src = `(<[^>]+>|(?:${PROPS}):\\s*[^;]+;|alt="")`;
  const pattern = new RegExp(src, "g");
  const isCode = (p) => new RegExp(`^${src}$`).test(p);
  const pieces = text.split(pattern);
  return (
    <>
      {pieces.map((p, i) =>
        isCode(p) ? (
          <code
            key={i}
            className="mx-0.5 rounded bg-slate-800/80 px-1 py-0.5 font-mono text-[11px] text-cyan-300"
          >
            {p}
          </code>
        ) : (
          <span key={i}>{p}</span>
        )
      )}
    </>
  );
}

function ConceptBlocks({ blocks }) {
  return (
    <div className="space-y-4">
      {blocks.map((b, i) => {
        if (b.type === "heading")
          return (
            <h3 key={i} className="pt-2 text-sm font-bold tracking-tight text-cyan-300">
              {b.body}
            </h3>

        if (b.type === "text")
          return (

        if (b.type === "code")

            <pre key={i} className="overflow-x-auto rounded-lg border border-slate-800 bg-slate-950 p-3">
              <code className="font-mono text-xs leading-relaxed text-cyan-200">{b.body}</code>
            </pre>

        if (b.type === "tip")
          return (
            <div key={i} className="flex gap-3 rounded-lg border border-amber-500/25 bg-amber-500/5 p-3">
              <Lightbulb className="h-4 w-4 shrink-0 text-amber-400" />
              <p className="text-xs leading-relaxed text-slate-300">{b.body}</p>
            </div>
          );

        if (b.type === "mistake")
          return (
            <div key={i} className="flex gap-3 rounded-lg border border-rose-500/25 bg-rose-500/5 p-3">
              <AlertTriangle className="h-4 w-4 shrink-0 text-rose-400" />
              <p className="text-xs leading-relaxed text-slate-300">
                <span className="font-bold text-rose-300">Common mistake: </span>
                {b.body}
              </p>
            </div>
          );

        if (b.type === "reference")
          return (
            <div key={i} className="overflow-hidden rounded-lg border border-slate-800">
              {b.items.map((item, j) => (
                <div
                  key={j}
                  className={`p-3 ${j % 2 ? "bg-slate-950/40" : "bg-slate-950/70"} ${
                    j > 0 ? "border-t border-slate-800" : ""
                  }`}
                >
                  <code className="font-mono text-xs font-bold text-cyan-300">{item.code}</code>
                  <p className="mt-1 text-xs leading-relaxed text-slate-300">{item.what}</p>
                  {item.note && (

                      {item.note}
                    </p>
                  )}
                </div>
              ))}
            </div>
          );

        return null;
      })}
    </div>
  );
}

                const parts = [done[key(i, 0)], done[key(i, 1)], done[key(i, 2)]].filter(Boolean).length;
                const complete = parts === 3;
                const locked = i > furthest;
                const current = i === selected;
                return (
                  <button
                    key={i}
                    onClick={() => !locked && setSelected(i)}
                    disabled={locked}
                    className={`relative z-[1] flex items-center gap-3 rounded-lg px-2 py-2.5 text-left ${
                      current ? "bg-slate-800/60" : "hover:bg-slate-800/30"
                    }`}
                  >
                    <div
                      className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-full border text-[11px] font-bold ${
                        complete
                          ? "border-emerald-400 bg-emerald-400 text-slate-950"
                          : current
                          ? "border-cyan-400 bg-cyan-500/20 text-cyan-300"
                          : locked
                          ? "border-slate-700 bg-slate-800 text-slate-600"
                          : "border-slate-600 bg-slate-800 text-slate-400"
                      }`}
                    >
                      {complete ? <Check className="h-3 w-3" /> : locked ? <Lock className="h-2.5 w-2.5" /> : i + 1}
                    </div>
                    <div className="min-w-0 flex-1">
                      <p
                        className={`text-sm ${
                          locked ? "text-slate-600" : current ? "font-medium text-slate-100" : "text-slate-300"
                        }`}
                      >
                        {l.title}
                      </p>
                      {!locked && <p className="truncate text-xs text-slate-500">{l.blurb}</p>}
                    </div>
                    {!locked && parts > 0 && !complete && (
                      <span className="shrink-0 text-[10px] font-bold text-cyan-300">{parts}/3</span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="mt-4 flex items-center justify-between rounded-xl border border-cyan-500/30 bg-cyan-500/5 p-4">
            <div className="min-w-0">
              <p className="text-xs text-slate-500">Selected · {UNIT_1.lessons[selected].xp} XP available</p>
              <p className="truncate text-sm font-bold text-slate-100">{UNIT_1.lessons[selected].title}</p>
            </div>
            <button
              onClick={() => {
                setOpenLesson(selected);
                setActivePart(0);
                setScreen("lesson");
              }}
              className="ml-3 flex shrink-0 items-center gap-2 rounded-lg bg-slate-100 px-4 py-2 text-sm font-bold text-slate-950 hover:bg-white"
            >
              <Play className="h-3.5 w-3.5" /> Start
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (screen === "lesson") {
    const isDone = done[key(openLesson, activePart)];
    return (
      <div className="min-h-screen bg-slate-950 text-slate-100">
        {renderStatusBar()}
        <div className="mx-auto max-w-3xl px-5 py-8">
          <button
            onClick={() => setScreen("map")}
            className="mb-4 flex items-center gap-1 text-xs font-bold text-slate-500 hover:text-slate-300"
          >
            <ChevronLeft className="h-3.5 w-3.5" /> Back to map
          </button>

          <div className="mb-6 flex items-start gap-4">
            <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border border-slate-800 bg-slate-900 text-lg font-bold text-cyan-400">
              {openLesson + 1}
            </div>
            <div className="min-w-0 flex-1">
              <h1 className="text-2xl font-bold tracking-tight">{lesson.title}</h1>
              <p className="mt-1 text-sm text-slate-400">{lesson.blurb}</p>
            </div>
          </div>

          {/* collapsible core reference — hidden until asked for */}
          <div className="mb-6">
            <button
              onClick={() => setShowRef((v) => !v)}
              className={`flex w-full items-center gap-2 rounded-lg border px-3 py-2.5 text-left ${
                showRef ? "border-slate-700 bg-slate-900" : "border-slate-800 bg-slate-900/50 hover:border-slate-700"
              }`}
            >
              <BookMarked className="h-4 w-4 shrink-0 text-emerald-400" />
              <span className="text-xs font-bold text-slate-300">Core reference</span>
              <span className="truncate text-xs text-slate-600">— open this when you forget a word</span>
              <ChevronDown
                className={`ml-auto h-4 w-4 shrink-0 text-slate-500 transition-transform ${
                  showRef ? "rotate-180" : ""
                }`}
              />
            </button>

            {showRef && (
              <div className="mt-2 overflow-hidden rounded-lg border border-slate-800">
                {lesson.learn.ref.map((r, i) => (
                  <div
                    key={i}
                    className={`p-3 ${i % 2 ? "bg-slate-950/40" : "bg-slate-950/70"} ${
                      i > 0 ? "border-t border-slate-800" : ""
                    }`}
                  >
                    <p className="font-mono text-xs font-bold text-emerald-300">{r.label}</p>
                    <p className="mt-1 text-xs leading-relaxed text-slate-300">
                      <StepText text={r.body} />
                    </p>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* part switcher */}
          <div className="mb-6 flex gap-1.5 sm:gap-2">
            {[
              { icon: BookOpen, label: "Learn", sub: lesson.learn.subtitle },
              { icon: Dumbbell, label: "Practice", sub: lesson.practice.subtitle },
              { icon: Rocket, label: "Build", sub: lesson.build.subtitle },
            ].map((p, i) => {
              const Icon = p.icon;
              return (
                <button
                  key={i}
                  onClick={() => setActivePart(i)}
                  className={`min-w-0 flex-1 rounded-lg border px-2 py-2 text-left sm:px-3 sm:py-2.5 ${
                    activePart === i
                      ? i === 2
                        ? "border-fuchsia-500/50 bg-fuchsia-500/10"
                        : i === 1
                        ? "border-violet-500/50 bg-violet-500/10"
                        : "border-cyan-500/50 bg-cyan-500/10"
                      : "border-slate-800 bg-slate-900 hover:border-slate-700"
                  }`}
                >
                  <div className="flex items-center gap-1.5">
                    {done[key(openLesson, i)] ? (
                      <CheckCircle2 className="h-3.5 w-3.5 shrink-0 text-emerald-400" />
                    ) : (
                      <Icon className={`h-3.5 w-3.5 shrink-0 ${activePart === i ? "text-slate-200" : "text-slate-600"}`} />
                    )}
                    <span
                      className={`truncate text-[11px] font-bold sm:text-xs ${
                        activePart === i
                          ? i === 2
                            ? "text-fuchsia-300"
                            : i === 1
                            ? "text-violet-300"
                            : "text-cyan-300"
                          : "text-slate-400"
                      }`}
                    >
                      {p.label}
                    </span>
                  </div>
                  <p className="mt-0.5 hidden truncate text-xs text-slate-500 sm:block">{p.sub}</p>
                </button>
              );
            })}
          </div>

          {/* LEARN */}
          {!isPractice && !isBuild && (
            <>
              <div className="mb-4 rounded-xl border border-slate-800 bg-slate-900 p-5">
                <ConceptBlocks blocks={lesson.learn.blocks} />
              </div>
              {renderLab()}
              <div className="rounded-xl border border-slate-800 bg-slate-900 p-5">
                <div className="mb-2 flex items-center gap-2">
                  <ListChecks className="h-4 w-4 text-cyan-400" />
                  <h2 className="text-sm font-bold text-slate-200">Your turn</h2>
                </div>
                <p className="mb-4 text-sm leading-relaxed text-slate-300">{part.task}</p>

                <div className="mb-4 rounded-lg border border-slate-800 bg-slate-950/60 p-3">
                  <div className="mb-2 flex items-center gap-2">
                    <HelpCircle className="h-3.5 w-3.5 text-cyan-400" />
                    <span className="text-xs font-bold text-slate-300">Check your learning</span>
                  </div>
                  <p className="mb-3 text-xs leading-relaxed text-slate-300">
                    <StepText text={lesson.learn.check.q} />
                  </p>
                  <button
                    onClick={() => setShowAnswer((v) => !v)}
                    className="rounded-md border border-slate-700 px-2.5 py-1.5 font-mono text-[11px] font-bold text-slate-300 hover:border-slate-600 hover:text-slate-100"
                  >
                    {showAnswer ? "Hide answer" : "Show answer"}
                  </button>
                  {showAnswer && (
                    <p className="mt-3 border-t border-slate-800 pt-3 text-xs leading-relaxed text-slate-400">
                      <StepText text={lesson.learn.check.a} />
                    </p>
                  )}
                </div>

                {part.extra && (
                  <div className="mb-4 rounded-lg border border-slate-800 bg-slate-950/60 p-3">
                    <div className="mb-1 flex items-center gap-2">
                      <span className="text-xs font-bold text-cyan-300">{part.extra.label}</span>
                      <span className="rounded bg-fuchsia-500/15 px-1.5 py-0.5 text-[10px] font-bold text-fuchsia-300">
                        +{part.extra.xp} XP
                      </span>
                    </div>
                    <p className="text-xs leading-relaxed text-slate-400">{part.extra.text}</p>
                  </div>
                )}

                <button
                  onClick={markComplete}
                  disabled={isDone}
                  className={`flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-bold ${
                    isDone
                      ? "border border-emerald-500/30 bg-emerald-500/10 text-emerald-400"
                      : "bg-slate-100 text-slate-950 hover:bg-white"
                  }`}
                >
                  {isDone ? (
                    <>
                      <CheckCircle2 className="h-4 w-4" /> Completed
                    </>
                  ) : (
                    <>Mark complete · +{(part.xp ?? 0) + (part.extra?.xp ?? 0)} XP</>
                  )}
                </button>
              </div>
            </>
          )}


          {/* PRACTICE */}
          {isPractice && (
            <>
              <div className="mb-4 rounded-xl border border-violet-500/30 bg-violet-500/5 p-5">
                <div className="mb-2 flex items-center gap-2">
                  <Dumbbell className="h-4 w-4 text-violet-400" />
                  <h2 className="text-sm font-bold text-slate-200">Drills</h2>
                  <span className="ml-auto text-xs font-bold text-violet-300">
                    {part.drills.filter((_, i) => checked[`${openLesson}:${i}`]).length}/{part.drills.length}
                  </span>
                </div>
                <p className="mb-4 text-sm leading-relaxed text-slate-300">{part.intro}</p>

                <div className="space-y-1.5">
                  {part.drills.map((d, i) => {
                    const k = `${openLesson}:${i}`;
                    const on = checked[k];
                    return (
                      <button
                        key={i}
                        onClick={() => setChecked((c) => ({ ...c, [k]: !c[k] }))}
                        className="flex w-full items-start gap-2.5 rounded-lg border border-slate-800 bg-slate-950/50 p-3 text-left hover:border-slate-700"
                      >
                        {on ? (
                          <CheckSquare className="mt-0.5 h-4 w-4 shrink-0 text-emerald-400" />
                        ) : (
                          <Square className="mt-0.5 h-4 w-4 shrink-0 text-slate-600" />
                        )}
                        <div className="min-w-0">
                          <p className={`text-xs leading-relaxed ${on ? "text-slate-500 line-through" : "text-slate-200"}`}>
                            <span className="mr-1.5 font-bold text-violet-400">{i + 1}.</span>
                            <StepText text={d.text} />
                          </p>
                          {d.hint && !on && (
                            <p className="mt-1 text-[11px] leading-relaxed text-slate-500">{d.hint}</p>
                          )}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {renderLab()}

              <div className="rounded-xl border border-violet-500/30 bg-violet-500/5 p-5">
                <button
                  onClick={markComplete}
                  disabled={isDone}
                  className={`flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-bold ${
                    isDone
                      ? "border border-emerald-500/30 bg-emerald-500/10 text-emerald-400"
                      : "bg-slate-100 text-slate-950 hover:bg-white"
                  }`}
                >
                  {isDone ? (
                    <>
                      <CheckCircle2 className="h-4 w-4" /> Drills complete
                    </>
                  ) : (
                    <>Mark drills complete · +{part.xp} XP</>
                  )}
                </button>
              </div>
            </>
          )}

          {/* BUILD */}
          {isBuild && (
            <>
              <div className="mb-4 rounded-xl border border-fuchsia-500/30 bg-fuchsia-500/5 p-5">
                <div className="mb-2 flex items-center gap-2">
                  <Rocket className="h-4 w-4 text-fuchsia-400" />
                  <h2 className="text-sm font-bold text-slate-200">Project brief</h2>
                </div>
                <p className="mb-4 text-sm leading-relaxed text-slate-300">{part.brief}</p>

                <div className="mb-2 flex items-center gap-2">
                  <p className="text-xs font-bold text-slate-500">Build steps</p>
                  <span className="ml-auto text-xs font-bold text-fuchsia-300">
                    {part.requirements.filter((_, i) => checked[`b${openLesson}:${i}`]).length}/
                    {part.requirements.length}
                  </span>
                </div>
                <div className="space-y-1">
                  {part.requirements.map((r, i) => {
                    const k = `b${openLesson}:${i}`;
                    const on = checked[k];
                    return (
                      <button
                        key={i}
                        onClick={() => setChecked((c) => ({ ...c, [k]: !c[k] }))}
                        className="flex w-full items-start gap-2.5 rounded-lg border border-slate-800 bg-slate-950/50 p-2.5 text-left hover:border-slate-700"
                      >
                        {on ? (
                          <CheckSquare className="mt-0.5 h-3.5 w-3.5 shrink-0 text-emerald-400" />
                        ) : (
                          <Square className="mt-0.5 h-3.5 w-3.5 shrink-0 text-slate-600" />
                        )}
                        <span
                          className={`text-xs leading-relaxed ${
                            on ? "text-slate-500 line-through" : "text-slate-200"
                          }`}
                        >
                          <span className="mr-1.5 font-bold text-fuchsia-400">{i + 1}.</span>
                          <StepText text={r} />
                        </span>
                      </button>
                    );
                  })}
                </div>

                <div className="mt-4 flex items-center gap-2 rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-2.5">
                  <Code2 className="h-4 w-4 shrink-0 text-fuchsia-400" />
                  <p className="text-xs text-slate-400">
                    The files below are empty on purpose. Build this from scratch.
                  </p>
                </div>

                {part.deploy && (
                  <div className="mt-2 flex items-center gap-2 rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-2.5">
                    <Globe className="h-4 w-4 shrink-0 text-cyan-400" />
                    <p className="text-xs text-slate-400">
                      When it's working here, move it to your own editor, commit it, and deploy it live.
                    </p>
                  </div>
                )}
              </div>

              {renderLab()}

              <div className="rounded-xl border border-fuchsia-500/30 bg-fuchsia-500/5 p-5">
                <button
                  onClick={markComplete}
                  disabled={isDone}
                  className={`flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-bold ${
                    isDone
                      ? "border border-emerald-500/30 bg-emerald-500/10 text-emerald-400"
                      : "bg-slate-100 text-slate-950 hover:bg-white"
                  }`}
                >
                  {isDone ? (
                    <>
                      <CheckCircle2 className="h-4 w-4" /> Project submitted
                    </>
                  ) : (
                    <>Submit project · +{part.xp} XP</>
                  )}
                </button>
              </div>
            </>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="flex min-h-screen items-center justify-center bg-slate-950 p-4">
      <div className="w-full max-w-sm rounded-2xl border border-slate-800 bg-slate-900 p-8 text-center">
        <div className="relative mx-auto mb-5 flex h-20 w-20 items-center justify-center">
          <span className="absolute h-20 w-20 animate-ping rounded-full bg-cyan-500/10" style={{ animationDuration: "2s" }} />
          <span className="absolute h-16 w-16 rounded-full bg-cyan-500/20" />
          <div className="relative flex h-14 w-14 items-center justify-center rounded-full border border-cyan-400/40 bg-cyan-500/20">
            <PartyPopper className="h-6 w-6 text-cyan-300" />
          </div>
        </div>
        <p className="mb-1 text-xs font-bold uppercase tracking-wider text-cyan-400">Unit complete</p>
        <h1 className="mb-2 text-2xl font-bold tracking-tight text-slate-50">{UNIT_1.badge} unlocked</h1>
        <p className="mb-6 text-sm text-slate-400">
          You finished {UNIT_1.title} with {xp} XP. JavaScript is next.
        </p>
        <div className="mb-6 flex items-center gap-3 rounded-xl border border-fuchsia-500/30 bg-fuchsia-500/5 p-3 text-left">
          <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-fuchsia-500/30 bg-fuchsia-500/20">
            <Star className="h-5 w-5 text-fuchsia-300" />
          </div>
          <div>
            <p className="text-xs text-slate-500">New badge earned</p>
            <p className="text-sm font-bold text-slate-100">{UNIT_1.badge}</p>
          </div>
        </div>
        <button
          onClick={() => setScreen("map")}
          className="flex w-full items-center justify-center gap-2 rounded-lg bg-slate-100 py-2.5 text-sm font-bold text-slate-950 hover:bg-white"
        >
          Back to map <ArrowRight className="h-4 w-4" />
        </button>
      </div>
    </div>
  );
}


const rootEl = document.getElementById("root");
rootEl.innerHTML = "";
ReactDOM.createRoot(rootEl).render(<Prototype />);
</script>
</body>
</html>
